name: Slow suite

# Real-data / network / binary-dependent tests. Outside fast CI (they run
# locally before release per CONTRIBUTING.md). Dispatch this workflow for
# release validation when hosted execution is needed, including upstream
# drift checks such as ClinVar CLNSIG vocabulary changes.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The PLINK round-trip test needs plink2. Ubuntu's apt "plink" is PLINK
      # 1.07, which the test cannot use, so it skipped. Pinned release archive,
      # checked against its SHA-256 before use.
      - name: Install plink2 (for @integration roundtrip)
        env:
          PLINK2_URL: https://s3.amazonaws.com/plink2-assets/alpha6/plink2_linux_x86_64_20241222.zip
          PLINK2_SHA256: 90566ccee6259d377416ba2655646a87b4605feca66bf97c78bb649baf8784cf
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/plink2.zip" "$PLINK2_URL"
          echo "$PLINK2_SHA256  $RUNNER_TEMP/plink2.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/plink2.zip" plink2 -d "$RUNNER_TEMP/plink2"
          sudo install -m 0755 "$RUNNER_TEMP/plink2/plink2" /usr/local/bin/plink2
          plink2 --version

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vcf-index]"

      - name: Generate test fixture
        run: python tests/generate_mock_data.py

      - name: Download current ClinVar caches
        run: allelix db update --only clinvar

      - name: Run ClinVar CLNSIG drift sentinel
        env:
          ALLELIX_CI_REQUIRE_CACHE: "1"
        run: >-
          pytest
          tests/databases/test_clinvar_clnsig_drift.py::TestClinvarClnsigDrift::test_no_new_clnsig_values_in_live_cache
          --junitxml=drift-results.xml
          --no-cov

      - name: Assert drift sentinel executed
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          path = pathlib.Path("drift-results.xml")
          if not path.is_file():
              sys.exit("drift-results.xml was not produced")

          cases = [
              case
              for case in ET.parse(path).findall(".//testcase")
              if case.get("name") == "test_no_new_clnsig_values_in_live_cache"
          ]
          if len(cases) != 1:
              sys.exit(f"expected exactly one drift testcase, found {len(cases)}")

          bad_children = [
              child.tag
              for child in cases[0]
              if child.tag in {"skipped", "failure", "error"}
          ]
          if bad_children:
              sys.exit(f"drift testcase did not pass cleanly: {bad_children}")

          print("ClinVar drift sentinel executed and passed.")
          PY

      - name: Pytest (slow + integration only)
        run: pytest -v --tb=short -m "slow or integration" --no-cov
